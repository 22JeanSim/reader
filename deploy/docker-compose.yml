# reader 生产 compose: 镜像来自 GHCR (GitHub Actions 构建推送)
# 部署: cd deploy && GHCR_PAT=xxx ./pull-deploy.sh
name: reader

services:
  reader:
    image: ghcr.io/hehecat/reader:latest
    container_name: reader
    ports:
      # 通用默认 8080; 作者家庭拓扑用 .env 的 READER_PORT=4396 覆盖
      - "${READER_PORT:-8080}:8080"
    volumes:
      # 用户数据/书架/缓存 sqlite 所在 (READER_APP_WORKDIR=/storage)
      - /home/reader/storage:/storage/storage
      # 容器内 /data (mongo 遗留/杂项), 命名 volume 便于备份
      - data:/data
    env_file: .env
    environment:
      READER_APP_WORKDIR: /storage
      READER_APP_WEB_ROOT: /app/web-ui/dist
      # 书源抓取允许内网地址 (本地书同步/TTS 网关等)
      SSRF_ALLOW_PRIVATE: "true"
      READER_BROWSER_FIRST: "0"
      # secure 模式开关 (登录/书源权限校验)
      READER_APP_SECURE: "true"
      TZ: Asia/Shanghai
    restart: unless-stopped

volumes:
  data:
